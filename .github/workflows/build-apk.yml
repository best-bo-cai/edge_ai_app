# .github/workflows/build-apk.yml
# 代码提交 → 远程打包 APK（GitHub Actions）：
# - push 到 main / feature 分支（源码有改动时）自动触发
# - 手动触发：Actions 页面 → Build APK → Run workflow
# - 产物：Artifacts 下载（保留 30 天）；打 tag 时同时发布到 Releases
#
# 关键点：llama.cpp 源码不入库（体积大），CI 上先浅克隆到
# native/third_party/llama.cpp，CMake 检测到后即走真实推理分支；
# 否则会打出 dummy 桩的 Mock 模式 APK。
name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

# 同一分支新提交触发时，取消排队中的旧构建（省额度）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5' # 与本地开发版本保持一致，避免 Dart 语法/依赖差异

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 克隆 llama.cpp（真实推理依赖）
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git native/third_party/llama.cpp

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 接受 Android SDK 许可（缺 NDK 时允许 Gradle 自动安装）
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 打包 APK（arm64 真实推理）
        run: flutter build apk --release

      - name: 上传构建产物（Artifacts，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: edge_ai_app-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 发布到 Releases（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
